name: taprivo

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: taprivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taprivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taprivo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-taprivo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taprivo} -d ${POSTGRES_DB:-taprivo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taprivo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taprivo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-taprivo}:${POSTGRES_PASSWORD:-taprivo_dev}@postgres:5432/${POSTGRES_DB:-taprivo}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-xxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-change-me-qr-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      NFC_HMAC_SECRET: ${NFC_HMAC_SECRET:-change-me-nfc-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      ACCESS_TTL: ${ACCESS_TTL:-15m}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      ENFORCE_DEVICE_BINDING: ${ENFORCE_DEVICE_BINDING:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_SA_FILE: ${GOOGLE_WALLET_SA_FILE:-}
      GOOGLE_WALLET_SA_JSON: ${GOOGLE_WALLET_SA_JSON:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Taprivo <no-reply@taprivo.app>}
      APP_NAME: ${APP_NAME:-Taprivo}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
      - uploads_data:/app/uploads
      # Mount the Google Wallet service-account key (read-only). The directory
      # is gitignored except for a .gitkeep; drop google-wallet-sa.json in it.
      - ./backend/secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: taprivo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
