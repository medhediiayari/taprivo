name: taprivo_mobile
description: "Taprivo loyalty — Flutter client (iOS + Android)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Networking + state
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  # Sign in with Google
  google_sign_in: ^6.2.1
  # Secure token storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.2
  # Device capabilities
  nfc_manager: ^3.5.0
  geolocator: ^12.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  mobile_scanner: ^6.0.2 # owner-side QR scanning (camera)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
